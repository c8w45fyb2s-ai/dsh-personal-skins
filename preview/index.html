<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人皮肤 · 本地预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8e4e5;color:#353239;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    /* The mock declares its tokens on body, exactly where the real theme declares them. */
    body{--dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#f8f5f5;--dsw-alias-bg-layer-2:#ffffff;--dsw-alias-bg-layer-3:#ffffff}
    [data-slot="conversation.view"]{display:contents}
    .demo-shell{min-height:100vh;padding:24px clamp(16px,4vw,64px) 50px}
    .demo-header{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1500px;margin:0 auto 18px;color:#5b565c}
    .demo-header strong{color:#343139;font-size:17px}.demo-header span{font-size:12px;color:#807980}
    .demo-app{position:relative;isolation:isolate;transform:translateZ(0);max-width:1500px;height:min(72vh,790px);min-height:520px;margin:auto;border:1px solid #d9d2d5;border-radius:18px;overflow:hidden;background:transparent;box-shadow:0 22px 80px #3a26341f}
    .demo-topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 23px;border-bottom:1px solid #ffffff80;background:var(--dsw-alias-bg-layer-1);backdrop-filter:blur(18px);position:relative;z-index:1}
    .demo-brand{font-weight:650}.demo-top-actions{display:flex;gap:9px}.demo-top-actions span{width:26px;height:26px;border-radius:50%;background:#ebe5e7}
    .demo-chat{height:calc(100% - 58px);display:flex;flex-direction:column;align-items:center;position:relative}
    .demo-content{width:min(800px,90%);flex:1;overflow:auto;padding:58px 20px 28px;background:var(--dsw-alias-bg-layer-2)}
    .demo-greeting{margin:8vh 0 34px;text-align:center;font-size:28px;font-weight:600;letter-spacing:.01em}
    .demo-message{max-width:690px;margin:0 auto 24px;padding:17px 21px;border-radius:16px;background:#ffffffa8;box-shadow:0 5px 25px #4437400b}
    .demo-message.user{margin-left:auto;max-width:520px;background:#f8f1f2e8}.demo-message small{display:block;color:#8a8288;margin-bottom:6px;font-size:11px}
    .demo-composer{width:min(800px,90%);margin:12px 20px 28px;padding:12px 16px 11px;border:1px solid #ffffffa8;border-radius:18px;background:var(--dsw-alias-bg-layer-3);box-shadow:0 8px 32px #44374012;backdrop-filter:blur(14px)}
    .demo-composer textarea{width:100%;height:54px;resize:none;border:0;outline:0;background:transparent;color:#4c474d;font:inherit}.demo-composer footer{display:flex;justify-content:space-between;color:#918991;font-size:12px}
    .preview-note{max-width:1500px;margin:12px auto 0;color:#746c73;font-size:12px}
    #editor{max-width:1500px;margin:34px auto 0;padding:0 8px}
    @media(max-width:700px){.demo-app{min-height:480px;height:68vh}.demo-greeting{font-size:22px}.demo-content{padding-top:24px}.demo-message{padding:13px}.demo-header span{display:none}}
  </style>
</head>
<body>
  <section class="demo-shell">
    <header class="demo-header"><div><strong>DeepSeek Harness</strong><div>本地预览环境 · 仅使用临时演示数据</div></div><span>预览不会修改正式 DSH 配置</span></header>
    <main class="demo-app" data-slot="root">
      <div class="demo-topbar"><div class="demo-brand">DeepSeek</div><div class="demo-top-actions"><span></span><span></span><span></span></div></div>
      <section class="demo-chat" data-slot="main">
        <div data-slot="conversation.view">
          <div class="demo-content">
            <h1 class="demo-greeting">你好，需要我帮你做些什么？</h1>
            <article class="demo-message user"><small>你</small>帮我把这个聊天空间布置得更舒服一些。</article>
            <article class="demo-message"><small>DeepSeek</small>当然可以。这里展示主题背景、面板透明度和聊天输入区的实际叠加效果。你可以在下面的编辑器里调整设置，再点击“应用”查看变化。</article>
          </div>
        </div>
        <div class="demo-composer" data-slot="conversation.composer.bar"><textarea placeholder="给 DeepSeek 发送消息"></textarea><footer><span>＋　联网搜索</span><span>深度思考　　发送 ↗</span></footer></div>
      </section>
    </main>
    <p class="preview-note">上方是独立的聊天界面模拟，下方编辑器和渲染层连接同一套本地服务路由。</p>
    <div id="editor"></div>
  </section>
  <script type="module">
    import {createClientApi} from '/src/client/api.js';
    import {mountEditor} from '/src/client/editor.js';
    import {installRenderer} from '/src/client/renderer.js';
    let renderer;
    const api=createClientApi({fetch:window.fetch.bind(window),onProfile:profile=>renderer?.apply(profile?.presets?.find(p=>p.id===profile.activePresetId)||null)});
    renderer=installRenderer({api,layerRoot:document.querySelector('.demo-app')});
    const unmount=mountEditor(document.querySelector('#editor'),{api,getUiTheme:renderer.getUiTheme});
    window.addEventListener('pagehide',()=>{unmount?.();renderer.dispose();api.dispose();},{once:true});
  </script>
</body>
</html>
